<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Archive Fever</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b211a; }
  #display { position: fixed; inset: 0; }
  #status {
    position: fixed; left: 0; right: 0; top: 40%;
    text-align: center; color: #efe6d8; font: 16px/1.6 serif;
    pointer-events: none;
  }
  #status.error { color: #ffb4a8; pointer-events: auto; padding: 0 24px; }
  #timer {
    position: fixed; right: 8px; top: 8px; z-index: 10;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(0, 0, 0, .6); color: #fff; font: 12px monospace;
  }

  /* The sign-in screen: the Swing login screen (LoginPanel) redrawn in HTML, on the same
     412 x 917 design scaled to fit, so that nobody waits for the Java runtime to start
     just to be sent to Kakao and back. Positions are the ones LoginPanel paints at; the
     artwork is copied from the Swing resources when the server is built. */
  @font-face {
    font-family: 'Cormorant Garamond';
    font-weight: 700;
    src: url('login/CormorantGaramond-Bold.ttf') format('truetype');
  }
  #signin { position: fixed; inset: 0; }
  #signin-stage {
    position: absolute; left: 50%; top: 50%; width: 412px; height: 917px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    overflow: hidden; background: #fffee4;
  }
  #signin-stage > * { position: absolute; margin: 0; box-sizing: border-box; }
  .carpet {
    left: 0; top: 783px; width: 412px; height: 135px;
    background: linear-gradient(rgba(231, 47, 47, .2), rgba(231, 47, 47, .2)),
                url('login/login-carpet.png') center / cover;
  }
  .wallpaper { left: -29px; width: 450px; height: 446px; background: url('login/login-wallpaper.png') center / cover; }
  .wallpaper.upper { top: 0; }
  .wallpaper.lower { top: 244px; }
  .wood { top: 517px; height: 304px; background-image: url('login/login-wood.png'); background-repeat: no-repeat; }
  .wood.right { left: 181px; width: 347px; background-size: cover; background-position: center; }
  .wood.left { left: -114px; width: 302px; background-size: 347px 304px; background-position: 0 0; }
  .title {
    left: 74px; top: 370px; width: 320px; height: 46px;
    font: 700 36px/46px 'Cormorant Garamond', serif; color: #000; white-space: nowrap;
  }
  .kakao {
    left: 64px; top: 429px; width: 284px; height: 43px; border-radius: 6px;
    background: #fee500; color: rgba(0, 0, 0, .85); text-decoration: none;
    font: 700 14.16px/43px sans-serif; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .kakao:active { background: #e5ce00; }
  .kakao img { position: absolute; left: 13.2px; top: 13px; width: 17px; height: 17px; }
  #byname { left: 64px; top: 484px; width: 284px; }
  #byname.alone { top: 429px; }
  #byname input, #byname button {
    height: 38px; border-radius: 6px; font: 15px/1 sans-serif; box-sizing: border-box; vertical-align: top;
  }
  #byname input {
    width: 184px; padding: 0 10px; border: 1px solid #8a7a66; background: rgba(255, 254, 228, .92); color: #211b17;
  }
  #byname button { width: 94px; margin-left: 6px; border: 0; background: #211b17; color: #fffee4; }
  #byname button:disabled { opacity: .5; }
  #byname p { margin: 6px 0 0; font: 11px/1.4 sans-serif; color: #4a3f35; background: rgba(255, 254, 228, .8); padding: 2px 4px; border-radius: 3px; }
  #signin-message {
    left: 44px; top: 580px; width: 324px; padding: 6px 8px; border-radius: 4px; text-align: center;
    font: 12.5px/1.4 sans-serif; color: #fff; background: rgba(120, 30, 30, .88);
  }

  /* Correcting a collected passage: a form of the page's own over the Swing display, because
     an HTML text box gets the phone's keyboard and input methods, which Swing's do not
     reliably. Dimmed behind and paper-coloured like the Swing popups; near the top, so the
     keyboard does not cover it. */
  #passage-edit {
    position: fixed; inset: 0; z-index: 30; display: flex; justify-content: center; align-items: flex-start;
    padding-top: 10vh; background: rgba(0, 0, 0, .7);
  }
  #passage-edit[hidden] { display: none; }
  #passage-form {
    width: min(340px, 90vw); box-sizing: border-box; padding: 16px 16px 14px; border-radius: 3px;
    background: #f4efe6; color: #211b17; font: 15px/1.5 serif; box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
  #passage-form h2 { margin: 0 0 10px; font: 700 18px/1.2 serif; text-align: center; }
  #passage-form textarea, #passage-form input {
    box-sizing: border-box; border: 1px solid #8a7a66; border-radius: 3px; background: #fffdf6; color: #211b17;
    font: 16px/1.5 serif;
  }
  #passage-form textarea { display: block; width: 100%; height: 9.5em; padding: 8px; resize: none; }
  #passage-form label { display: block; margin-top: 10px; }
  #passage-form input { width: 5.5em; margin-left: 8px; padding: 4px 8px; }
  #passage-form label span { margin-left: 8px; font-size: 12px; color: #6b5f52; }
  #passage-edit-message { margin: 10px 0 0; font-size: 13px; color: #9b2d20; }
  #passage-form .actions { display: flex; gap: 8px; margin-top: 14px; }
  #passage-form .actions .space { flex: 1; }
  #passage-form button {
    height: 38px; padding: 0 14px; border-radius: 3px; border: 1px solid #211b17; background: transparent;
    color: #211b17; font: 15px/1 serif; -webkit-tap-highlight-color: transparent;
  }
  #passage-form button[type=submit] { background: #211b17; color: #fffee4; }
  #passage-form button#passage-delete { border-color: #9b2d20; color: #9b2d20; }
  #passage-form button:disabled { opacity: .5; }
</style>
<!-- The free CheerpJ licence requires loading the runtime from its CDN. -->
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
<div id="display"></div>
<div id="signin" hidden>
  <div id="signin-stage">
    <div class="carpet"></div>
    <div class="wallpaper upper"></div>
    <div class="wallpaper lower"></div>
    <div class="wood right"></div>
    <div class="wood left"></div>
    <div class="title">ARCHIVE FEVER</div>
    <a id="kakao" class="kakao" href="/auth/kakao/login" hidden><img src="login/kakao-logo.svg" alt="">카카오 로그인</a>
    <form id="byname" hidden>
      <input id="name" name="name" autocomplete="username" autocapitalize="none" spellcheck="false"
             maxlength="20" placeholder="이름 (영문 소문자·숫자)" aria-label="로그인할 이름"><button type="submit">로그인</button>
      <p>개발용 로그인입니다. 같은 이름으로 들어오면 같은 서재가 열립니다.</p>
    </form>
    <p id="signin-message" role="alert" hidden></p>
  </div>
</div>
<div id="passage-edit" hidden>
  <form id="passage-form" autocomplete="off">
    <h2>문장 고치기</h2>
    <textarea id="passage-text" maxlength="2000" aria-label="수집한 문장"></textarea>
    <label>쪽수<input id="passage-page" inputmode="numeric" maxlength="4" aria-label="쪽수"><span>모르면 비워 두세요</span></label>
    <p id="passage-edit-message" role="alert" hidden></p>
    <div class="actions">
      <button type="button" id="passage-delete">삭제</button>
      <span class="space"></span>
      <button type="button" id="passage-cancel">취소</button>
      <button type="submit" id="passage-save">저장</button>
    </div>
  </form>
</div>
<div id="status">Archive Fever를 불러오는 중…</div>
<div id="timer" hidden></div>
<script type="module" src="host.js"></script>
</body>
</html>
