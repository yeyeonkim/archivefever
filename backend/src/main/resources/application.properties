spring.application.name=archivefever-server
server.port=8080

# Directory holding the Swing client JAR and manifest.json (written by the Gradle task swingWeb).
archivefever.swing-dir=build/swing

# The host page changes during development; always revalidate it.
spring.web.resources.cache.cachecontrol.no-cache=true

# Uploaded photos and cached book images live under this directory, and so does the
# database file when the default database is used.
archivefever.data-dir=data

# The database. The default is an H2 file, which needs no setup. To use MySQL instead
# (recommended for data that must not be lost), set spring.datasource.url, username and
# password in application-local.properties; see README.
#
# REUSE_SPACE=FALSE: H2 then only ever appends to the file. With the default it also writes
# into free space in the middle of the file, and what it wrote there was not found again
# after the server process was killed without shutting down: a sentence saved ten minutes
# earlier was gone. The file grows a little with every change in exchange; H2 shrinks it
# again whenever it is closed normally.
spring.datasource.url=jdbc:h2:file:./${archivefever.data-dir}/archivefever;REUSE_SPACE=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Phone camera photos are several megabytes.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# A scan waiting for its photo longer than this is treated as abandoned.
archivefever.scan.ttl=5m

# Signing in. With a Kakao REST API key (https://developers.kakao.com) people sign in with
# Kakao; put the key, and the client secret if the key has one switched on, in the
# environment or in backend/application-local.properties (see README). Without a key,
# signing in is by typing a name, which is for development only.
archivefever.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
archivefever.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
archivefever.kakao.auth-url=https://kauth.kakao.com
archivefever.kakao.api-url=https://kapi.kakao.com
# Signing in by name: true or false. Left empty it is on only while there is no Kakao key.
archivefever.auth.dev-login=
# How long a sign-in lasts before the person has to sign in again.
archivefever.auth.session-ttl=30d

# YES24 Open API (https://developers.yes24.com). Without a key the server answers
# lookups with clearly labelled stub books, so the rest of the flow can be developed.
# Put the key in the YES24_API_KEY environment variable, or in an untracked file
# backend/application-local.properties as: archivefever.yes24.api-key=...
archivefever.yes24.enabled=true
archivefever.yes24.base-url=https://apis.yes24.com/v1
archivefever.yes24.api-key=${YES24_API_KEY:}
spring.config.import=optional:file:./application-local.properties
