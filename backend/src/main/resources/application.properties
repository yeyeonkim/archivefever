spring.application.name=archivefever-server
server.port=8080

# Directory holding the Swing client JAR and manifest.json (written by the Gradle task swingWeb).
archivefever.swing-dir=build/swing

# The host page changes during development; always revalidate it.
spring.web.resources.cache.cachecontrol.no-cache=true

# Database, uploaded photos and cached book images all live under this directory.
archivefever.data-dir=data
spring.datasource.url=jdbc:h2:file:./${archivefever.data-dir}/archivefever
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Phone camera photos are several megabytes.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# A scan waiting for its photo longer than this is treated as abandoned.
archivefever.scan.ttl=5m

# YES24 Open API (https://developers.yes24.com). Without a key the server answers
# lookups with clearly labelled stub books, so the rest of the flow can be developed.
# Put the key in the YES24_API_KEY environment variable, or in an untracked file
# backend/application-local.properties as: archivefever.yes24.api-key=...
archivefever.yes24.enabled=true
archivefever.yes24.base-url=https://apis.yes24.com/v1
archivefever.yes24.api-key=${YES24_API_KEY:}
spring.config.import=optional:file:./application-local.properties
