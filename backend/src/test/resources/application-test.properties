# Tests never touch the developer's database or the real YES24 API. The Gradle test task
# sets the same datasource as system properties, which no local file can override.
spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
archivefever.data-dir=build/test-data
archivefever.yes24.enabled=false
